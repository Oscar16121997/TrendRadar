name: Hot News Crawler

on:
  schedule:
    # 我们使用的是 github 官方提供的资源来进行的推送，而每个账号的资源是限额的，为了不被官方判定为滥用而面临封号的风险，不建议比半小时更低
    - cron: "34 13 * * *" # 每天 UTC 13:34（按当前 UTC 时间加 10 分钟后向上取整）
  workflow_dispatch:
    inputs:
      run_douyin_test:
        description: "Run exactly one TikHub Douyin API request; confirm free credit and endpoint price before running"
        required: false
        type: boolean
        default: false
      run_douyin_full_discovery:
        description: "Run one full 8-category Douyin discovery (up to 32 requests; estimated API cost up to $0.32)"
        required: false
        type: boolean
        default: false
      run_douyin_reanalysis:
        description: "Run DeepSeek scoring on the saved Nov 12 Douyin report only; no TikHub calls"
        required: false
        type: boolean
        default: false
      run_marketing_trend:
        description: "Run the separate 12-account marketing trend detector and email its HTML/CSV reports"
        required: false
        type: boolean
        default: false
      run_douyin_daily_viral:
        description: "Run daily Douyin high-like videos published today, over 10,000 likes, excluding political propaganda"
        required: false
        type: boolean
        default: false

# 添加权限设置
permissions:
  contents: write
  actions: read

jobs:
  crawl:
    if: ${{ github.event_name != 'schedule' && inputs.run_douyin_test != true && inputs.run_douyin_full_discovery != true && inputs.run_douyin_reanalysis != true && inputs.run_marketing_trend != true && inputs.run_douyin_daily_viral != true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Verify required files
        run: |
          echo "🔍 检查必需的配置文件..."

          if [ ! -f config/config.yaml ]; then
            echo "❌ 错误: config/config.yaml 文件不存在"
            echo "请参考项目文档创建配置文件"
            exit 1
          fi

          if [ ! -f config/frequency_words.txt ]; then
            echo "❌ 错误: config/frequency_words.txt 文件不存在"
            echo "请参考项目文档创建频率词配置文件"
            exit 1
          fi

          echo "✅ 配置文件检查通过"

      - name: Run crawler
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_ACTIONS: true
        run: python main.py


      - name: Commit and push if changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update by GitHub Actions at $(TZ=Asia/Shanghai date)" && git push)

  douyin_api_test:
    if: ${{ inputs.run_douyin_test == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install requests==2.32.4

      - name: Run one-request TikHub test
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          DOUYIN_TEST_OUTPUT: /tmp/douyin_test_results.json
        run: python douyin_video_discovery.py

      - name: Upload Douyin test result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: douyin-test-results
          path: /tmp/douyin_test_results.json
          if-no-files-found: warn

  douyin_full_discovery:
    if: ${{ github.event_name == 'schedule' || inputs.run_douyin_full_discovery == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install collection dependency
        run: python -m pip install requests==2.32.4

      - name: Validate China-only discovery and email scripts
        run: python -m py_compile douyin_full_discovery.py send_douyin_report_email.py

      - name: Run full 8-category Douyin discovery
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUYIN_OUTPUT_DIR: output/douyin_full_run
        run: python douyin_full_discovery.py

      - name: Email China-only Douyin trends
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DOUYIN_OUTPUT_DIR: output/douyin_full_run
        run: python send_douyin_report_email.py

      - name: Upload full Douyin discovery report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: douyin-full-discovery-report
          path: output/douyin_full_run/
          if-no-files-found: warn

  douyin_daily_viral:
    # The daily scheduler intentionally runs only bots 2 and 3; bot 4 remains manual opt-in.
    if: ${{ inputs.run_douyin_daily_viral == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install collection dependency
        run: python -m pip install requests==2.32.4

      - name: Validate daily viral detector and email scripts
        run: python -m py_compile douyin_daily_viral.py send_douyin_daily_viral_email.py

      - name: Run daily high-like Douyin discovery
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUYIN_DAILY_VIRAL_OUTPUT_DIR: output/douyin_daily_viral
        run: python douyin_daily_viral.py

      - name: Email daily high-like Douyin trends
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DOUYIN_DAILY_VIRAL_OUTPUT_DIR: output/douyin_daily_viral
        run: python send_douyin_daily_viral_email.py

      - name: Upload daily high-like report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: douyin-daily-viral-report
          path: output/douyin_daily_viral/
          if-no-files-found: warn

  douyin_reanalysis:
    if: ${{ inputs.run_douyin_reanalysis == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Download saved Douyin discovery report
        uses: actions/download-artifact@v4
        with:
          name: douyin-full-discovery-report
          repository: Oscar16121997/TrendRadar
          run-id: 43331179376
          github-token: ${{ github.token }}
          path: input

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install analysis dependency
        run: python -m pip install requests==2.32.4

      - name: Run DeepSeek analysis on saved videos
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DOUYIN_INPUT_JSON: input/douyin_full_discovery.json
          DOUYIN_OUTPUT_DIR: output/douyin_ai_analysis
        run: python douyin_analyze_report.py

      - name: Email DeepSeek Douyin report
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DOUYIN_OUTPUT_DIR: output/douyin_ai_analysis
        run: python send_douyin_report_email.py

      - name: Upload DeepSeek-ranked report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: douyin-deepseek-analysis-report
          path: output/douyin_ai_analysis/
          if-no-files-found: warn

  marketing_trend:
    if: ${{ github.event_name == 'schedule' || inputs.run_marketing_trend == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests==2.32.4

      - name: Validate marketing detector files
        run: |
          python -m py_compile marketing_trend.py send_marketing_trend_email.py
          python -m json.tool config/marketing_accounts.json > /dev/null
          echo "Marketing detector syntax and account config are valid."

      - name: Run marketing account trend detector
        env:
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_MARKETING_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MARKETING_OUTPUT_DIR: output/marketing_trend
        run: python marketing_trend.py

      - name: Email marketing trend report
        env:
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MARKETING_OUTPUT_DIR: output/marketing_trend
        run: python send_marketing_trend_email.py

      - name: Upload marketing trend artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: marketing-trend-report
          path: output/marketing_trend/
          if-no-files-found: warn

  report_daily_status:
    name: Report daily bot status to Healthchecks
    needs: [douyin_full_discovery, marketing_trend]
    if: ${{ always() && (github.event_name == 'schedule' || (inputs.run_douyin_full_discovery == true && inputs.run_marketing_trend == true)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Send success or failure heartbeat
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          DOUYIN_RESULT: ${{ needs.douyin_full_discovery.result }}
          MARKETING_RESULT: ${{ needs.marketing_trend.result }}
        run: |
          if [ -z "$HEALTHCHECKS_PING_URL" ]; then
            echo "::warning::HEALTHCHECKS_PING_URL is not configured yet; skipping external heartbeat."
            exit 0
          fi

          if [ "$DOUYIN_RESULT" = "success" ] && [ "$MARKETING_RESULT" = "success" ]; then
            echo "Both scheduled bots completed successfully."
            curl --retry 3 --retry-delay 5 --fail --silent --show-error "$HEALTHCHECKS_PING_URL"
          else
            echo "At least one scheduled bot did not complete successfully."
            curl --retry 3 --retry-delay 5 --fail --silent --show-error "${HEALTHCHECKS_PING_URL%/}/fail"
            exit 1
          fi
