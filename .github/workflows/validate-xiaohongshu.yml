name: Validate Xiaohongshu Bot

on:
  push:
    branches:
      - main
    paths:
      - "xiaohongshu_full_discovery.py"
      - "send_xiaohongshu_report_email.py"
      - ".github/workflows/validate-xiaohongshu.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependency
        run: python -m pip install requests==2.32.4

      - name: Compile Xiaohongshu scripts
        run: python -m py_compile xiaohongshu_full_discovery.py send_xiaohongshu_report_email.py
